<?xml version="1.0" encoding="UTF-8"?>
<!--
  Control-panel nav icon: a folding screen, the thing you put around part of a room to keep one
  part of it apart from the rest — which is Seclude's whole job, and reads at 16px because it is
  three shapes and nothing else.

  Black on transparent, no tile. Craft recolours this itself; a stroke or a fill of anything but
  black comes out wrong in the nav.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="#000000" fill-rule="evenodd">
    <!-- Left panel, hinged back -->
    <path d="M12 26.5a2 2 0 0 1 2.6-1.9l17 5.2a2 2 0 0 1 1.4 1.9V86a2 2 0 0 1-2.6 1.9l-17-5.2A2 2 0 0 1 12 80.8V26.5Zm5 3.7v49.4l12 3.7V33.9l-12-3.7Z"/>

    <!-- Centre panel, face on and nearest -->
    <path d="M37 24a2 2 0 0 1 2-2h22a2 2 0 0 1 2 2v66a2 2 0 0 1-2 2H39a2 2 0 0 1-2-2V24Zm5 3v60h16V27H42Z"/>

    <!-- Right panel, hinged back -->
    <path d="M88 26.5a2 2 0 0 0-2.6-1.9l-17 5.2a2 2 0 0 0-1.4 1.9V86a2 2 0 0 0 2.6 1.9l17-5.2a2 2 0 0 0 1.4-1.9V26.5Zm-5 3.7v49.4l-12 3.7V33.9l12-3.7Z"/>

    <!-- Rails: the lattice that makes it a screen rather than three doors -->
    <path d="M17 47.5l12 3.7v5l-12-3.7v-5Zm25-1.5h16v5H42v-5Zm41 1.5l-12 3.7v5l12-3.7v-5Z"/>
  </g>
</svg>
