<?xml version="1.0" encoding="UTF-8"?>
<!--
  Control-panel nav mask: the folding screen from icon.svg on its own, black on transparent, no
  tile. Craft recolours this itself; a stroke or a fill of anything but black comes out wrong in the
  nav.

  The geometry is lifted verbatim from icon.svg — the same three paths, the windows still punched
  out with fill-rule="evenodd". Two icons that drift apart is how a plugin ends up unrecognisable
  between the store listing and the nav.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Seclude</title>
  <!-- Left wing, receding, with its window -->
  <path fill="#000000" fill-rule="evenodd" d="M36,22 L16,27 V73 L36,78 Z M32,29 L20,32 V45 L32,43.5 Z"/>
  <!-- Centre panel, with an arched window -->
  <path fill="#000000" fill-rule="evenodd" d="M42,20 H58 A3,3 0 0 1 61,23 V77 A3,3 0 0 1 58,80 H42 A3,3 0 0 1 39,77 V23 A3,3 0 0 1 42,20 Z M44.5,44 V32 A5.5,5.5 0 0 1 55.5,32 V44 Z"/>
  <!-- Right wing, mirrored -->
  <path fill="#000000" fill-rule="evenodd" d="M64,22 L84,27 V73 L64,78 Z M68,29 L80,32 V45 L68,43.5 Z"/>
</svg>
